name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-features
      - name: Build each feature set
        run: |
          cargo build --no-default-features
          cargo build --no-default-features --features fix
          cargo build --no-default-features --features open-api
      # Live tests need demo credentials: they are compiled here, not run.
      - name: Test
        run: |
          targets=$(ls tests | sed -n 's/\.rs$//p' | grep -v _live | sed 's/^/--test /')
          cargo test --all-features --lib $targets
          cargo test --all-features --doc
      - name: Compile live tests
        run: cargo test --all-features --no-run
