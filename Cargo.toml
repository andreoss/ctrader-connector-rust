[package]
name = "ctrader-connector"
version = "0.3.3"
edition = "2024"
rust-version = "1.86"
description = "Client library for the cTrader Open API and the cTrader FIX 4.4 API"
readme = "README.adoc"
autoexamples = false
keywords = ["ctrader", "trading", "protobuf", "fix"]
categories = ["api-bindings", "finance"]

[lib]
name = "ctrader_connector"
path = "src/lib.rs"

[features]
default = []
open-api = ["dep:prost", "dep:serde_json", "dep:tokio", "dep:tokio-rustls", "dep:webpki-roots"]
fix = ["dep:tokio", "dep:tokio-rustls", "dep:webpki-roots"]
logging = ["dep:tracing"]

[dependencies]
prost = { version = "0.14.5", optional = true }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
webpki-roots = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[dev-dependencies]
prost-build = "0.14.5"
protox = "0.10.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "open_api_mock"
required-features = ["open-api"]

[[test]]
name = "open_api_clock_mock"
required-features = ["open-api"]

[[test]]
name = "open_api_data_mock"
required-features = ["open-api"]

[[test]]
name = "open_api_trading_mock"
