[package]
name = "ctrader-connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Client library for the cTrader Open API and the cTrader FIX 4.4 API"
readme = "README.adoc"
keywords = ["ctrader", "trading", "protobuf", "fix"]
categories = ["api-bindings", "finance"]

[lib]
name = "ctrader_connector"
path = "src/lib.rs"

[features]
default = []
open-api = []
fix = []

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
